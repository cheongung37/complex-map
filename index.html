<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>공장 진입로 안내</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { padding: 0; margin: 0; height: 100%; }
        #map { height: 100vh; width: 100vw; }
        
        /* 화면 위에 떠 있는 버튼 디자인 */
        #ui-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            gap: 10px;
        }
        .route-btn {
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            background-color: #444;
            border: 2px solid white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="ui-container">
        <button id="btn-bpa" class="route-btn" onclick="loadRoute('bpa.kml', this)">BPA 사무실 가기</button>
        <button id="btn-pc" class="route-btn" onclick="loadRoute('pc.kmz', this)">PC 사무실 가기</button>
    </div>

    <div id="map"></div>
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-kmz@latest/dist/leaflet-kmz.js"></script>
    
    <script>
        // 1. 지도 중앙 좌표 새롭게 업데이트
        var map = L.map('map').setView([34.841103, 127.682041], 15);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        // 2. 담당자님 도면 덮어쓰기 (새로운 모서리 좌표 적용, 캐시 방지 v=3)
        var imageUrl = 'YS_YS1-northside.png?v=3';
        var imageBounds = [[34.829992, 127.662519], [34.852214, 127.701564]];
        L.imageOverlay(imageUrl, imageBounds).addTo(map);

        // 3. 경로 그리기 기능
        var currentKmz = null;

        function loadRoute(fileName, btnElement) {
            var buttons = document.getElementsByClassName('route-btn');
            for(var i=0; i<buttons.length; i++) {
                buttons[i].style.backgroundColor = '#444';
            }
            btnElement.style.backgroundColor = '#e74c3c';

            if (currentKmz !== null) {
                map.removeLayer(currentKmz);
            }

            currentKmz = L.kmzLayer().addTo(map);
            currentKmz.on('load', function(e) {
                map.fitBounds(e.layer.getBounds());
            });
            currentKmz.load(fileName);
        }

        // 4. 실시간 GPS 추적 기능
        var gpsMarker = null;
        var gpsCircle = null;

        map.locate({setView: false, watch: true, enableHighAccuracy: true});

        map.on('locationfound', function(e) {
            var radius = e.accuracy / 2;
            if (!gpsMarker) {
                gpsMarker = L.marker(e.latlng).addTo(map).bindPopup("기사님 현재 위치").openPopup();
                gpsCircle = L.circle(e.latlng, radius).addTo(map);
            } else {
                gpsMarker.setLatLng(e.latlng);
                gpsCircle.setLatLng(e.latlng);
                gpsCircle.setRadius(radius);
            }
        });

        map.on('locationerror', function(e) {
            alert("위치 정보를 가져올 수 없습니다. 스마트폰의 '위치 권한'을 허용해 주세요.");
        });

        // 웹페이지가 처음 열릴 때 BPA 사무실(kml) 띄우기
        window.onload = function() {
            loadRoute('bpa.kml', document.getElementById('btn-bpa'));
        };
    </script>
</body>
</html>
